<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كلمة مرور جديدة | نماء</title><link rel="stylesheet" href="styles.css?v=9.6.0"></head>
<body class="login-body">
<main class="login-shell"><section class="login-card card"><img src="assets/header-banner.png?v=9.5.0" alt="منصة نماء" class="login-banner"><div class="login-content">
<span class="eyebrow">تحديث آمن</span><h1>إنشاء كلمة مرور جديدة</h1><p>اختاري كلمة مرور جديدة ثم أكديها.</p>
<form id="resetPasswordForm">
<label>كلمة المرور الجديدة<div class="password-field"><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-toggle-password="resetPassword" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div></label>
<label>تأكيد كلمة المرور<div class="password-field"><input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-toggle-password="resetPasswordConfirm" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div></label>
<button class="btn primary login-submit" type="submit">حفظ كلمة المرور</button><div id="resetMessage" class="login-message" aria-live="polite"></div></form>
<a href="login.html" class="back-link">العودة إلى تسجيل الدخول</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=9.6.0"></script></body></html>
