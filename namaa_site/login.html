<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دخول الإدارة | نماء</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card card">
      <img src="assets/header-banner.png" alt="منصة نماء" class="login-banner" />
      <div class="login-content">
        <span class="eyebrow">دخول آمن</span>
        <h1>لوحة إدارة منصة نماء</h1>
        <p>استخدمي البريد وكلمة المرور الخاصة بحسابك. صلاحيات التعديل تُحدد تلقائيًا من قاعدة البيانات.</p>
        <form id="loginForm">
          <label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="email" required /></label>
          <label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
          <button class="btn primary login-submit" type="submit">تسجيل الدخول</button>
          <div id="loginMessage" class="login-message" aria-live="polite"></div>
        </form>
        <a href="index.html" class="back-link">العودة إلى واجهة الزوار</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
