<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0b6fa4" />
  <title>الخطة التنفيذية | نماء</title>
  <link rel="stylesheet" href="styles.css?v=9.6.0" />
</head>
<body class="executive-page">
  <header class="container exec-header">
    <img src="assets/header-banner.png?v=9.5.0" alt="منصة نماء" />
  </header>

  <main id="executivePlanPage" class="container">
    <div class="exec-toolbar exec-toolbar-compact">
      <a class="btn secondary" href="admin.html">العودة إلى الخطة الفصلية</a>
      <button id="execAddRow" class="btn primary exec-admin-only" type="button">+ إضافة صف</button>
    </div>

    <div id="execPlanError" class="exec-error" hidden></div>

    <section class="card exec-card">
      <div class="exec-section-heading">
        <h1 id="execPlanTitle">الخطة التنفيذية</h1>
        <div id="execPlanMeta" class="exec-meta"></div>
      </div>
      <table class="exec-table" aria-label="الخطة التنفيذية">
        <thead>
          <tr>
            <th rowspan="2" class="exec-num-head">#</th>
            <th rowspan="2">الإجراءات</th>
            <th colspan="3">التنفيذ</th>
          </tr>
          <tr>
            <th class="exec-choice-head">نعم</th>
            <th class="exec-choice-head">لا</th>
            <th>السبب</th>
          </tr>
        </thead>
        <tbody id="execRows"></tbody>
      </table>
      <div class="exec-actions exec-admin-only">
        <button id="execSave" class="btn primary" type="button">حفظ الخطة التنفيذية</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=9.6.0"></script>
</body>
</html>
